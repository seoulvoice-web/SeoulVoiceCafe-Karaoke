{% extends 'layout.html' %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-body">
          <h4>Configuración</h4>
          <form method="post">
            <div class="mb-3">
              <label class="form-label">Ruta a wkhtmltopdf</label>
              <input name="wkhtmltopdf_path" class="form-control" value="{{ wk_path or '' }}" placeholder="C:\\Program Files\\wkhtmltopdf\\bin\\wkhtmltopdf.exe" />
              <div class="form-text">Dejar vacío para buscar automáticamente en rutas comunes o en PATH.</div>
            </div>
            <button class="btn btn-primary">Guardar</button>
            <a class="btn btn-secondary" href="/admin">Volver</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
