{% extends 'layout.html' %}

{% block content %}
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Editar usuario: {{ user.username }}</h4>
      <div>
        <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('admin_users') }}">Volver a lista</a>
      </div>
    </div>

    <div class="card p-3">
      <form method="post" action="" class="row g-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="col-12 col-md-6">
          <label class="form-label">Usuario</label>
          <input type="text" name="username" class="form-control" value="{{ user.username }}" />
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" value="{{ user.email or '' }}" />
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label">Rol</label>
          <select name="role" class="form-select">
            <option value="Staff" {% if user.role == 'Staff' %}selected{% endif %}>Staff</option>
            <option value="Personal Nuevo" {% if user.role == 'Personal Nuevo' %}selected{% endif %}>Personal Nuevo</option>
            <option value="Admin" {% if user.role == 'Admin' %}selected{% endif %}>Admin</option>
          </select>
        </div>
        <div class="col-12 col-md-6 d-flex align-items-center">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="is_admin" id="isAdminChk" value="1" {% if user.is_admin %}checked{% endif %}>
            <label class="form-check-label" for="isAdminChk">Es administrador</label>
          </div>
        </div>

        <div class="col-12">
          <label class="form-label">Nueva contraseña (opcional)</label>
          <input type="text" name="password" class="form-control" placeholder="Dejar en blanco para no cambiar" />
        </div>
        <div class="col-12 col-md-6 d-flex align-items-center">
          <input type="hidden" name="must_change" value="0">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="must_change" id="mustChangeChk" value="1" {% if user.must_change_password %}checked{% endif %}>
            <label class="form-check-label" for="mustChangeChk">Forzar cambio de contraseña en el próximo inicio</label>
          </div>
        </div>

        <div class="col-12 text-end">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <a href="{{ url_for('admin_users') }}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
