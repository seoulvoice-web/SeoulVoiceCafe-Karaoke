{% extends 'auth_layout.html' %}
{% set hide_sidebar = true %}
{% block content %}
  <div class="login-wrapper">
    <div class="login-hero text-center mb-4">
      <h1 class="mt-2">Restablecer contraseña</h1>
      <p class="muted-lead">Cambia la contraseña para la cuenta {% if username %}<strong>{{ username }}</strong>{% endif %}</p>
    </div>

    <div class="card login-card login-card-narrow mx-auto">
      <div class="card-body">
        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="" autocomplete="on">
          <div class="mb-3 input-group input-with-icon">
            <span class="input-group-text bg-transparent border-0" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17 8V7a5 5 0 00-10 0v1H5v11h14V8h-2zm-8 0V7a3 3 0 116 0v1H9z" fill="#000"/></svg>
            </span>
            <input name="password" type="password" class="form-control" placeholder="Nueva contraseña" required />
          </div>

          <div class="mb-3 input-group input-with-icon">
            <span class="input-group-text bg-transparent border-0" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17 8V7a5 5 0 00-10 0v1H5v11h14V8h-2zm-8 0V7a3 3 0 116 0v1H9z" fill="#000"/></svg>
            </span>
            <input name="password2" type="password" class="form-control" placeholder="Repetir contraseña" required />
          </div>

          <button type="submit" class="btn btn-gradient w-100 mb-2">Cambiar contraseña</button>
        </form>

        <div class="text-center mt-3 small">
          <a href="/login">Volver a iniciar sesión</a>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
