{% extends 'layout.html' %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Crear Notificación</h3>
    <a href="{{ url_for('admin_notifications') }}" class="btn btn-sm btn-outline-secondary">Volver</a>
  </div>
  <form method="post" class="card p-3">
    <div class="mb-3">
      <label class="form-label">Título</label>
      <input name="title" class="form-control" />
    </div>
    <div class="mb-3">
      <label class="form-label">Mensaje</label>
      <textarea name="body" class="form-control" rows="4"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Monto (opcional)</label>
      <input name="amount" class="form-control" />
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="for_all" id="for_all" checked>
      <label class="form-check-label" for="for_all">Mostrar a todos los usuarios (notificación pública)</label>
    </div>
    <button class="btn btn-primary">Crear</button>
  </form>
</div>
{% endblock %}
